<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <title>Hand Portal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <!-- หน้าเริ่มต้น -->
    <section id="intro" class="intro glass">
      <h1 class="logo">HAND<span>PORTAL</span></h1>
      <p class="tagline">เปิดกล้อง กางมือสองข้าง แล้วสร้างพอร์ทัลฟิลเตอร์แบบเรียลไทม์</p>
      <button id="btn-start" class="btn btn-primary" type="button">Start Camera</button>
      <p class="hint">ต้องอนุญาตให้เข้าถึงกล้อง · ภาพทั้งหมดประมวลผลบนอุปกรณ์ของคุณ</p>
    </section>

    <!-- พื้นที่กล้อง -->
    <section id="stage" class="stage" hidden>
      <video id="video" playsinline muted autoplay></video>
      <canvas id="view"></canvas>

      <div class="hud hud-top glass">
        <span id="st-hand" class="chip">มือ: —</span>
        <span id="st-filter" class="chip">ฟิลเตอร์: —</span>
        <span id="st-mode" class="chip">โหมด: 2D</span>
      </div>


      <nav class="hud hud-bottom glass" aria-label="ปุ่มควบคุม">
        <button id="btn-prev" class="btn" type="button" title="ฟิลเตอร์ก่อนหน้า" disabled>◀</button>
        <button id="btn-next" class="btn" type="button" title="ฟิลเตอร์ถัดไป" disabled>▶</button>
        <button id="btn-landmarks" class="btn" type="button" title="แสดง/ซ่อน Landmark" aria-pressed="false" disabled>Landmark</button>
        <button id="btn-switch" class="btn" type="button" title="สลับกล้องหน้า/หลัง" hidden>สลับกล้อง</button>
        <button id="btn-shot" class="btn" type="button" title="บันทึกภาพ">Capture</button>
        <button id="btn-full" class="btn" type="button" title="เต็มจอ">Fullscreen</button>
        <button id="btn-stop" class="btn btn-danger" type="button" title="หยุดกล้อง">Stop</button>
      </nav>
    </section>

    <div id="notice" class="notice glass" role="alert" hidden>
      <strong id="notice-title"></strong>
      <p id="notice-body"></p>
      <button id="notice-close" class="btn" type="button">ปิด</button>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
